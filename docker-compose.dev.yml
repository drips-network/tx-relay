services:
  db:
    image: docker.io/postgres:18.3
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tx_relay
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.1
    restart: always
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0"]
    ports: ["8545:8545"]
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
